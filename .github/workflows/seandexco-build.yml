name: SeanDexCo build probe

# Goal of this workflow: find out whether a Dexcom-only build of Juggluco
# compiles WITHOUT the proprietary Libre/Sibionics .so blobs.
#
# Reasoning: the only System.loadLibrary() call in the Java sources is
# libg.so, which CMake builds from the open C++ tree. The blobs listed in
# README are consumed by the libre3 / mobileSi flavors. Selecting
# libreOld + nosi + dex should therefore need no blobs at all.
#
# We build the WEAR variant first, because a watch-side collector is the
# whole point of the SeanDexCo project.

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/seandexco-build.yml"
      - "Common/**"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The build declares NDK 30.0.14904198 and CMake; the runner has the SDK
      # but the NDK licence is unaccepted and that exact NDK is absent.
      - name: Accept SDK licences and install NDK
        run: |
          set -eu
          SDK="$ANDROID_SDK_ROOT"
          echo "SDK=$SDK"
          yes | "$SDK"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          "$SDK"/cmdline-tools/latest/bin/sdkmanager --install "ndk;30.0.14904198" "cmake;3.22.1" 2>&1 | tail -5
          ls "$SDK"/ndk || true

      - name: Remove stale local.properties (points at author's machine)
        run: rm -f local.properties

      - name: Show candidate assemble tasks
        continue-on-error: true
        run: ./gradlew :Common:tasks --all 2>&1 | grep -iE "assemble.*(Wear|Mobile).*Dex" | head -40

      - name: Confirm the new Dexcom-only variant is now offered
        continue-on-error: true
        run: ./gradlew :Common:tasks --all 2>&1 | grep -iE "assemble(Wear|Mobile)LibreOldNosiDex" | head -20

      - name: Build Wear + LibreOld + NoSi + Dex + NoGoogle (release)
        continue-on-error: true
        run: |
          set +e
          # Sibionics ON: aidexx/java.cpp is compiled unconditionally by CMake but
          # its Sensoren members only exist when SIBIONICS=1. The Sibionics blobs
          # live in the mobileSi source set, so a wear build should not need them.
          ./gradlew :Common:assembleWearLibreOldSiDexNogoogleRelease \
                    :Common:assembleMobileLibreOldSiDexNogoogleRelease \
                    --no-daemon > build-full.log 2>&1
          echo "exit=$?"
          echo "===== compiler errors ====="
          grep -nE "error:|undefined (reference|symbol)|No such file|fatal error" build-full.log | head -40
          echo "===== ninja context ====="
          grep -n -B5 "ninja: build stopped" build-full.log | head -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-full-log
          path: build-full.log
          if-no-files-found: warn

      - name: Locate any APKs produced
        continue-on-error: true
        run: find . -name "*.apk" -newermt "-30 minutes" 2>/dev/null | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seandexco-juggluco-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
